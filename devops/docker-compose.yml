services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # С хоста (dotnet run, клиенты с машины) — localhost:9092.
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      
  # ─────────────────────────── Визуальный веб-интерфейс ───────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eventapi-kafka-ui
    ports:
      - "8082:8080" # Порт, по которому откроется сайт в браузере
    depends_on:
      kafka:
        condition: service_healthy # Ждем, пока Кафка полностью пройдет свой healthcheck
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      # Настройки подключения к нашей Кафке внутри сети Docker (используем INTERNAL listener)
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ─────────────────────────── Одна Postgres на 5432, три базы из init.sql ───────────────────────────
  postgres:
    image: postgres:16
    container_name: eventapi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────── Микросервисы ───────────────────────────
  auth-api:
    container_name: eventapi-auth
    build:
      context: ../YandexPracticum
      dockerfile: ../devops/dotnet-service.Dockerfile
      args:
        PROJECT_FILE: src/Auth.Service/Auth.Api/Auth.Api.csproj
    command: ["Auth.Api.dll"]
    ports:
      - "5125:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  events-api:
    container_name: eventapi-events
    build:
      context: ../YandexPracticum
      dockerfile: ../devops/dotnet-service.Dockerfile
      args:
        PROJECT_FILE: src/Events.Service/Events.Api/Events.Api.csproj
    command: ["Events.Api.dll"]
    ports:
      - "5130:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=events_db;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: events-service-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bookings-api:
    container_name: eventapi-bookings
    build:
      context: ../YandexPracticum
      dockerfile: ../devops/dotnet-service.Dockerfile
      args:
        PROJECT_FILE: src/Bookings.Service/Bookings.Api/Bookings.Api.csproj
    command: ["Bookings.Api.dll"]
    ports:
      - "5063:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=bookings_db;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
